name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ============================================================================
  # JOB 1: TESTES UNITÁRIOS (CI)
  # ============================================================================
  test:
    name: Executar Testes Unitários
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Executar testes com Maven
        run: mvn clean test

      - name: Gerar relatório de cobertura
        run: mvn jacoco:report

      - name: Upload do relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 30

  # ============================================================================
  # JOB 2: BUILD E PUSH DA IMAGEM DOCKER (CD)
  # ============================================================================
  build-and-push:
    name: Build e Push da Imagem Docker
    runs-on: ubuntu-latest
    needs: test  # Só executa se os testes passarem
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extrair metadados para Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/todolist-app
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build e Push da imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/todolist-app:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/todolist-app:buildcache,mode=max

      - name: Exibir tags da imagem
        run: echo "Imagem publicada com as tags ${{ steps.meta.outputs.tags }}"

  # ============================================================================
  # JOB 3: DEPLOY NO SERVIDOR (CD)
  # ============================================================================
  deploy:
    name: Deploy no Servidor de Produção
    runs-on: ubuntu-latest
    needs: build-and-push  # Só executa após o build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/todolist-app
          IMAGE_TAG: main-${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: IMAGE_NAME,IMAGE_TAG
          script: |
            # Navegar para o diretório do projeto
            cd ~/todolist || exit 1
            
            # Atualizar o código do repositório
            git pull origin main
            
            # Exportar variáveis de ambiente para o docker-compose
            export IMAGE_NAME=$IMAGE_NAME
            export IMAGE_TAG=$IMAGE_TAG
            
            # Fazer login no Docker Hub
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            
            # Parar e remover containers antigos
            docker-compose -f docker-compose.prod.yml down
            
            # Baixar a nova imagem
            docker pull ${IMAGE_NAME}:${IMAGE_TAG}
            
            # Subir os serviços com a nova imagem
            docker-compose -f docker-compose.prod.yml up -d
            
            # Limpar imagens antigas (manter apenas as 3 mais recentes)
            docker image prune -af --filter "until=72h"
            
            # Verificar status dos containers
            docker-compose -f docker-compose.prod.yml ps
            
            # Aguardar a aplicação ficar saudável
            echo "Aguardando aplicação inicializar..."
            sleep 30
            
            # Verificar health check
            docker-compose -f docker-compose.prod.yml exec -T todolist-app curl -f http://localhost:8080/actuator/health || echo "Warning: Health check falhou"

      - name: Notificar sucesso do deploy
        if: success()
        run: |
          echo "✅ Deploy realizado com sucesso!"
          echo "📦 Imagem: ${{ secrets.DOCKER_USERNAME }}/todolist-app:main-${{ github.sha }}"
          echo "🚀 Servidor: ${{ secrets.SERVER_HOST }}"

      - name: Notificar falha no deploy
        if: failure()
        run: |
          echo "❌ Falha no deploy!"
          echo "Verifique os logs acima para mais detalhes."
