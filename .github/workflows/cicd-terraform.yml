name: CI/CD Pipeline com Terraform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Permite execução manual

env:
  TF_VERSION: '1.6.0'

jobs:
  # ============================================================================
  # JOB 1: TESTES UNITÁRIOS (CI)
  # ============================================================================
  test:
    name: Executar Testes Unitários
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Executar testes com Maven
        run: mvn clean test

      - name: Gerar relatório de cobertura
        run: mvn jacoco:report

      - name: Upload do relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 30

  # ============================================================================
  # JOB 2: PROVISIONAR INFRAESTRUTURA (IaC)
  # ============================================================================
  provision-infra:
    name: Provisionar Infraestrutura com Terraform
    runs-on: ubuntu-latest
    needs: test  # Só executa se os testes passarem
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    # Outputs que serão usados pelo job de deploy
    outputs:
      server_ip: ${{ steps.terraform-output.outputs.public_ip }}
      
    defaults:
      run:
        working-directory: ./terraform
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true

      - name: Configurar credenciais do GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Criar arquivo terraform.tfvars
        run: |
          cat > terraform.tfvars << EOF
          gcp_project_id = "${{ secrets.GCP_PROJECT_ID }}"
          gcp_region     = "us-west1"
          gcp_zone       = "us-west1-b"
          instance_name  = "todolist-server"
          machine_type   = "e2-micro"
          boot_disk_size = 30
          boot_disk_type = "pd-standard"
          ssh_user       = "${{ secrets.SSH_USER }}"
          ssh_public_key = "${{ secrets.SSH_PUBLIC_KEY }}"
          environment    = "prod"
          EOF

      - name: Configurar backend do Terraform
        run: |
          cat > backend-config.hcl << EOF
          bucket = "${{ secrets.GCP_TERRAFORM_BUCKET }}"
          prefix = "terraform/state"
          EOF

      - name: Terraform Init
        run: terraform init -backend-config=backend-config.hcl

      - name: Terraform Format Check
        run: terraform fmt -check || true

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true

      - name: Publicar Plano do Terraform como comentário (PR)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan 📝
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            
            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Verificar status do Plan
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve tfplan

      - name: Obter outputs do Terraform
        id: terraform-output
        run: |
          PUBLIC_IP=$(terraform output -raw public_ip)
          echo "public_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT
          echo "✅ IP público da VM: $PUBLIC_IP"

      - name: Aguardar VM estar pronta
        run: |
          PUBLIC_IP="${{ steps.terraform-output.outputs.public_ip }}"
          echo "Aguardando VM $PUBLIC_IP estar acessível..."
          
          max_attempts=30
          attempt=0
          
          while [ $attempt -lt $max_attempts ]; do
            if nc -zv -w 5 $PUBLIC_IP 22 2>&1 | grep -q "succeeded"; then
              echo "✅ VM está acessível via SSH!"
              break
            fi
            
            attempt=$((attempt + 1))
            echo "Tentativa $attempt de $max_attempts..."
            sleep 10
          done
          
          if [ $attempt -eq $max_attempts ]; then
            echo "❌ VM não ficou acessível no tempo esperado"
            exit 1
          fi

      - name: Resumo da Infraestrutura
        run: |
          echo "## 🏗️ Infraestrutura Provisionada" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Recurso | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **IP Público** | \`${{ steps.terraform-output.outputs.public_ip }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Região** | us-west1 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tipo de Máquina** | e2-micro (Free Tier) |" >> $GITHUB_STEP_SUMMARY
          echo "| **SSH** | \`ssh ${{ secrets.SSH_USER }}@${{ steps.terraform-output.outputs.public_ip }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          terraform output >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # JOB 3: BUILD E PUSH DA IMAGEM DOCKER (CD)
  # ============================================================================
  build-and-push:
    name: Build e Push da Imagem Docker
    runs-on: ubuntu-latest
    needs: provision-infra  # Aguarda infraestrutura estar pronta
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extrair metadados para Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/todolist-app
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build e Push da imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/todolist-app:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/todolist-app:buildcache,mode=max

      - name: Resumo do Build
        run: |
          echo "## 🐳 Imagem Docker" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Informação | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Imagem** | \`${{ secrets.DOCKER_USERNAME }}/todolist-app\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tags** | \`${{ steps.meta.outputs.tags }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **SHA** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # JOB 4: DEPLOY NO SERVIDOR (CD)
  # ============================================================================
  deploy:
    name: Deploy no Servidor de Produção
    runs-on: ubuntu-latest
    needs: [provision-infra, build-and-push]  # Aguarda infra e build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar variáveis de ambiente
        run: |
          echo "SERVER_IP=${{ needs.provision-infra.outputs.server_ip }}" >> $GITHUB_ENV
          echo "IMAGE_NAME=${{ secrets.DOCKER_USERNAME }}/todolist-app" >> $GITHUB_ENV
          echo "IMAGE_TAG=main-${{ github.sha }}" >> $GITHUB_ENV

      - name: Exibir informações do deploy
        run: |
          echo "🚀 Iniciando deploy..."
          echo "📍 Servidor: ${{ env.SERVER_IP }}"
          echo "🐳 Imagem: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        with:
          host: ${{ needs.provision-infra.outputs.server_ip }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: IMAGE_NAME,IMAGE_TAG
          command_timeout: 10m
          script: |
            # Aguardar cloud-init terminar (Docker estar instalado)
            echo "Verificando se Docker está instalado..."
            max_attempts=60
            attempt=0
            
            while [ $attempt -lt $max_attempts ]; do
              if command -v docker &> /dev/null && docker ps &> /dev/null; then
                echo "✅ Docker encontrado e funcionando!"
                break
              elif command -v docker &> /dev/null; then
                echo "Docker encontrado, mas sem permissões. Tentando ativar grupo..."
                # Tentar recarregar as permissões do grupo
                sudo chmod 666 /var/run/docker.sock 2>/dev/null || true
              fi
              attempt=$((attempt + 1))
              echo "Aguardando Docker... tentativa $attempt de $max_attempts"
              sleep 10
            done
            
            if ! command -v docker &> /dev/null; then
              echo "❌ Docker não foi instalado. Verifique o startup script."
              exit 1
            fi
            
            # Garantir que temos permissões para usar o Docker
            if ! docker ps &> /dev/null; then
              echo "Corrigindo permissões do Docker..."
              sudo chmod 666 /var/run/docker.sock
            fi
            
            # Criar diretório do projeto se não existir
            mkdir -p ~/todolist
            cd ~/todolist
            
            # Clonar ou atualizar repositório
            if [ ! -d ".git" ]; then
              echo "Clonando repositório..."
              git clone https://github.com/aghiot321/To-do-List.git .
            else
              echo "Atualizando repositório..."
              git fetch origin
              git reset --hard origin/main
              git pull origin main
            fi
            
            # Criar arquivo .env se não existir
            if [ ! -f ".env" ]; then
              cat > .env << 'ENVFILE'
            MYSQL_ROOT_PASSWORD=maly/jubileu3
            MYSQL_DATABASE=todolist
            MYSQL_USER=todolist_user
            MYSQL_PASSWORD=maly/jubileu3
            MYSQL_PORT=3309
            SPRING_PROFILES_ACTIVE=prod
            ENVFILE
            fi
            
            # Exportar variáveis para docker-compose
            export IMAGE_NAME=$IMAGE_NAME
            export IMAGE_TAG=$IMAGE_TAG
            
            # Fazer login no Docker Hub
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            
            # Parar e remover containers antigos
            docker compose -f docker-compose.prod.yml down || true
            
            # Baixar a nova imagem
            docker pull ${IMAGE_NAME}:${IMAGE_TAG}
            
            # Subir os serviços com a nova imagem
            docker compose -f docker-compose.prod.yml up -d
            
            # Aguardar containers iniciarem
            echo "Aguardando containers iniciarem..."
            sleep 20
            
            # Verificar status dos containers
            docker compose -f docker-compose.prod.yml ps
            
            # Aguardar a aplicação ficar saudável
            echo "Aguardando aplicação inicializar..."
            max_health_attempts=30
            health_attempt=0
            
            while [ $health_attempt -lt $max_health_attempts ]; do
              if docker compose -f docker-compose.prod.yml exec -T todolist-app curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
                echo "✅ Aplicação está saudável!"
                break
              fi
              health_attempt=$((health_attempt + 1))
              echo "Verificando health... tentativa $health_attempt de $max_health_attempts"
              sleep 10
            done
            
            # Limpar imagens antigas (manter apenas as 3 mais recentes)
            docker image prune -af --filter "until=72h" || true
            
            # Exibir logs recentes
            echo "=== Últimos logs da aplicação ==="
            docker compose -f docker-compose.prod.yml logs --tail=50 todolist-app

      - name: Testar aplicação
        run: |
          echo "Testando acesso à aplicação..."
          curl -f http://${{ needs.provision-infra.outputs.server_ip }}:8080/actuator/health || echo "⚠️ Health check falhou"

      - name: Resumo do Deploy
        if: always()
        run: |
          echo "## 🚀 Deploy Concluído" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Informação | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Servidor** | \`${{ needs.provision-infra.outputs.server_ip }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Imagem** | \`${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **URL App** | http://${{ needs.provision-infra.outputs.server_ip }}:8080 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Health Check** | http://${{ needs.provision-infra.outputs.server_ip }}:8080/actuator/health |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ job.status }}" == "success" ]; then
            echo "### ✅ Deploy realizado com sucesso!" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Deploy falhou. Verifique os logs." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Notificar sucesso do deploy
        if: success()
        run: |
          echo "✅ Deploy realizado com sucesso!"
          echo "📦 Imagem: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          echo "🚀 Servidor: ${{ needs.provision-infra.outputs.server_ip }}"
          echo "🌐 URL: http://${{ needs.provision-infra.outputs.server_ip }}:8080"

      - name: Notificar falha no deploy
        if: failure()
        run: |
          echo "❌ Falha no deploy!"
          echo "Verifique os logs acima para mais detalhes."
