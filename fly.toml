# fly.toml - Configuração do Fly.io para ToDoList App

app = "todolist-app"
primary_region = "gru"  # São Paulo - escolha a região mais próxima

[build]
  # Usa o Dockerfile existente no projeto

[env]
  # Variáveis de ambiente para Spring Boot
  SPRING_PROFILES_ACTIVE = "production"
  JAVA_TOOL_OPTIONS = "-XX:MaxRAMPercentage=75.0 -XX:+UseG1GC"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "10s"
    grace_period = "30s"
    method = "GET"
    path = "/actuator/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# Configuração de deploy
[deploy]
  release_command = ""
